<!-- This configuration file specifies the required security policies for nkms. -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.nkms"/>
    <allow send_destination="org.nkms"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.nkms"/>
  </policy>

</busconfig>